name: Probe PR 16074 workers-utils identity

on:
  push:
    branches:
      - "probe/16074-workers-utils-identity"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Build Wrangler dependency chain
        run: pnpm --filter wrangler... build
      - name: Check Wrangler published declarations
        run: pnpm --filter wrangler type:tests
      - name: Check Vite plugin type identity
        run: pnpm --filter @cloudflare/vite-plugin check:type
      - name: Check formatting
        run: pnpm exec oxfmt --check packages/wrangler/package.json packages/wrangler/tsup.config.ts
