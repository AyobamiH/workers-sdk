name: Probe oxfmt PR 16074

on:
  push:
    branches:
      - "probe/16074-oxfmt"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format target files
        run: |
          pnpm exec oxfmt packages/wrangler/scripts/check-published-declarations.ts packages/wrangler/src/experimental-commands-api.ts
          git diff -- packages/wrangler/scripts/check-published-declarations.ts packages/wrangler/src/experimental-commands-api.ts
